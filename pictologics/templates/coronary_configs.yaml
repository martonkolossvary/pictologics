# Coronary CT Angiography Templates
# =================================
#
# Configurations for radiomics of coronary plaque in CT angiography, in four plaque
# types. The resegment step of each configuration keeps its HU range:
#
#   coronary      all plaque                -99.999 to 3000     HU
#   coronary_ncp  non-calcified plaque      -99.999 to  350.999 HU
#   coronary_lap  low-attenuation plaque    -99.999 to   29.999 HU
#   coronary_cp   calcified plaque          351     to 3000     HU
#
# The bounds -99.999, 29.999 and 350.999 keep -100 HU out, keep low-attenuation
# plaque below 30 HU, and keep non-calcified plaque below the 351 HU of calcified
# plaque, also for resampled values.
# Each plaque type has an "orig" configuration (intensity and morphology features),
# and FBN and FBS configurations (texture, histogram and IVH features). All of them
# resample to 0.5 mm. The FBS bins start at the lower bound of the HU range (IBSI).
# Each configuration finds and leaves out the padding value of the image
# (source_mode auto).
#
# Load: RadiomicsPipeline.from_template("coronary")

schema_version: "1.0"
description: "Coronary CT angiography configurations"

configs:
  coronary_orig:
    description: "Coronary plaque (-99.999 to 3000 HU): intensity and morphology features"
    source_mode: auto
    steps:
      - step: resample
        params:
          new_spacing: [0.5, 0.5, 0.5]
      - step: resegment
        params:
          range_min: -99.999
          range_max: 3000.0
      - step: extract_features
        params:
          families:
            - intensity
            - morphology
          include_spatial_intensity: false
          include_local_intensity: false

  coronary_fbn_16:
    description: "Coronary plaque (-99.999 to 3000 HU): FBN 16 bins; texture, histogram and IVH features"
    source_mode: auto
    steps:
