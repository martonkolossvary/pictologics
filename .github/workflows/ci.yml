name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Ruff
        run: |
          poetry run ruff check pictologics tests

      - name: Mypy
        run: |
          poetry run mypy pictologics

      - name: Towncrier Check
        if: github.event_name == 'pull_request'
        run: |
          poetry run towncrier check --compare-with origin/${{ github.base_ref }}

      - name: Pytest
        run: |
          poetry run pytest -q -n auto --cov=pictologics --cov-report=xml --cov-report=term-missing

      - name: JIT smoke
        env:
          PICTOLOGICS_DISABLE_WARMUP: "1"
        run: |
          unset NUMBA_DISABLE_JIT
          poetry run python - <<'PY'
          import os

          import numpy as np

          from pictologics import Image, RadiomicsPipeline

          assert os.environ.get("NUMBA_DISABLE_JIT") is None
          image = Image(
              np.arange(6 * 6 * 6, dtype=np.float32).reshape(6, 6, 6),
              spacing=(1.0, 1.0, 1.0),
              origin=(0.0, 0.0, 0.0),
          )
          mask_array = np.zeros((6, 6, 6), dtype=np.uint8)
          mask_array[1:5, 1:5, 1:5] = 1
          mask = Image(
              mask_array,
              spacing=(1.0, 1.0, 1.0),
              origin=(0.0, 0.0, 0.0),
          )
          pipeline = RadiomicsPipeline(load_standard=False, deduplicate=True)
          pipeline.add_config(
              "jit_smoke",
              [
                  {"step": "discretise", "params": {"method": "FBN", "n_bins": 8}},
                  {
                      "step": "extract_features",
                      "params": {
                          "families": ["intensity", "histogram", "ivh", "texture"]
                      },
                  },
              ],
          )
          result = pipeline.run(image, mask, config_names=["jit_smoke"])["jit_smoke"]
          assert len(result) >= 140
          assert result.notna().sum() >= 140
          PY

      - name: Changelog sync
        run: |
          cmp -s CHANGELOG.md docs/CHANGELOG.md

      - name: Docs strict build
        if: matrix.python-version == '3.12'
        env:
          PICTOLOGICS_DISABLE_WARMUP: "1"
        run: |
          poetry run mkdocs build --strict

      # The docs job deploys this site, so the docs are built once per push.
      - name: Upload Pages artifact
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: martonkolossvary/pictologics
          files: coverage.xml
          fail_ci_if_error: false

  # Intel Macs, and Intel Python under Rosetta (3D Slicer): the lock gives them numba 0.62.1
  # and NumPy 2.3.5, the last numba with macOS x86_64 builds. The tests include the JIT-on
  # warm-up test, so every kernel compiles with this numba.
  intel-mac:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'poetry'

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Check the numba and NumPy versions
        run: |
          poetry run python -c "import numba, numpy; v = (numba.__version__, numpy.__version__); print(v); assert v == ('0.62.1', '2.3.5'), v"

      - name: Pytest
        run: |
          poetry run pytest -q -n auto

  docs:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
