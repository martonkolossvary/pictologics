name: Notify SlicerPictologics of release

# When a stable Pictologics release is published, ask the SlicerPictologics extension
# to open a compatibility-qualified version-bump pull request. This fires a
# repository_dispatch that the extension's adopt-pictologics-release.yml workflow
# consumes (event type "pictologics-release", client_payload.version). That workflow
# validates the release and opens a review-only PR; it never auto-merges.
#
# Requires an org/repo secret SLICER_EXTENSION_DISPATCH_TOKEN: a personal access token
# (classic "repo" scope, or a fine-grained token with "contents: write") on
# martonkolossvary/SlicerPictologics. The default GITHUB_TOKEN cannot dispatch to
# another repository. Until that secret is configured, the job only prints a notice.

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  dispatch:
    name: Request extension version-bump adoption
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    env:
      DISPATCH_TOKEN: ${{ secrets.SLICER_EXTENSION_DISPATCH_TOKEN }}
    steps:
      - name: Skip without the dispatch token
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::SLICER_EXTENSION_DISPATCH_TOKEN is not set, so no dispatch was sent."

      - name: Send repository_dispatch to SlicerPictologics
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: martonkolossvary/SlicerPictologics
          event-type: pictologics-release
          client-payload: '{"version": "${{ github.event.release.tag_name }}"}'
