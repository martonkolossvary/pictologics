name: Publish to TestPyPI

on:
  workflow_dispatch:  # Manual trigger
  release:
    types: [prereleased]  # Triggered on pre-release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Required for Trusted Publisher (OIDC)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Clear build artifacts
        run: |
          rm -rf dist/ build/ *.egg-info

      - name: Run tests
        run: |
          poetry run pytest -q -n auto --cov=pictologics --cov-report=xml

      - name: Check the version
        run: |
          # The release tag without "v" and a pre-release suffix (v0.6.0-rc -> 0.6.0) must
          # equal the version in pyproject.toml and in pictologics/__init__.py.
          TAG="${GITHUB_REF#refs/tags/}"
          BASE="${TAG#v}"
          BASE="${BASE%%-*}"
          PROJECT="$(poetry version -s)"
          CODE="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' pictologics/__init__.py)"
          echo "tag $TAG, pyproject $PROJECT, __version__ $CODE"
          test "$BASE" = "$PROJECT" && test "$BASE" = "$CODE"

      - name: Build package
        run: |
          # Sync version with release tag
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Setting package version to $VERSION"
          poetry version $VERSION
          
          poetry build

      - name: Publish to TestPyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # No password needed - uses Trusted Publisher (OIDC)

      # Documentation is NOT deployed here. GitHub Pages is served from the
      # `github-pages` environment, which the CI workflow publishes via
      # actions/upload-pages-artifact + actions/deploy-pages on every push to
      # main. Pushing a built site to a `gh-pages` branch from here would write
      # to a branch that is never served, and is blocked by the repository
      # ruleset requiring code-scanning results on that branch.
