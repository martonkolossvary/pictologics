[tool.poetry]
name = "pictologics"
version = "0.7.1"
description = "IBSI-compliant radiomic feature extraction package"
authors = ["Márton Kolossváry <marton.kolossvary@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://martonkolossvary.github.io/pictologics/"
repository = "https://github.com/martonkolossvary/pictologics"
documentation = "https://martonkolossvary.github.io/pictologics/"
keywords = ["radiomics", "medical-imaging", "ibsi", "dicom", "nifti"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: Apache Software License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Scientific/Engineering :: Medical Science Apps.",
	"Typing :: Typed",
]
packages = [{include = "pictologics"}]
include = [
    { path = "pictologics/templates/*.yaml", format = ["sdist", "wheel"] }
]
exclude = ["tests", "docs", "scripts", "site", "coverage.xml", "junit.xml"]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = [
    { version = ">=2.0", python = "<3.14" },
    { version = ">=2.3.2", python = ">=3.14" },  # the first numpy with a Python 3.14 build
]
scipy = ">=1.16.3"
nibabel = ">=5.2.0"  # the first nibabel that works with numpy 2
pydicom = ">=3.0.1"  # the SEG reader uses pydicom.pixels
# The rule follows the Python process, not the hardware: Intel Python on Apple silicon (for
# example 3D Slicer under Rosetta) is x86_64 too. numba 0.62 is the last numba with macOS
# x86_64 builds (Python 3.12 and 3.13), and numba 0.63 is the first with Python 3.14 builds.
numba = [
    { version = ">=0.62.1,<0.63", markers = "sys_platform == 'darwin' and platform_machine == 'x86_64'" },
    { version = ">=0.62.1", python = "<3.14", markers = "sys_platform != 'darwin' or platform_machine != 'x86_64'" },
    { version = ">=0.63.0", python = ">=3.14", markers = "sys_platform != 'darwin' or platform_machine != 'x86_64'" },
]
pandas = ">=2.2.2"  # the first pandas that works with numpy 2
tqdm = ">=4.66.0"
matplotlib = { version = ">=3.10.0", optional = true }  # the extra "viz": visualize_slices
Pillow = ">=11.1.0"
PyWavelets = ">=1.6.0"  # the first PyWavelets that works with numpy 2
pyyaml = ">=6.0"
# Decodes compressed DICOM data with pydicom: JPEG Lossless, JPEG-LS, JPEG 2000 (and
# baseline JPEG, which Pillow also reads)
python-gdcm = ">=3.0.10"

[tool.poetry.extras]
viz = ["matplotlib"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
mypy = ">=1.0.0"
ruff = ">=0.8.0"
pytest-cov = "^7.0.0"
tabulate = "^0.9.0"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.0"
mkdocstrings = {extras = ["python"], version = "^1.0.0"}
pytest-xdist = "^3.8.0"
types-pyyaml = "^6.0.12.20250915"
towncrier = ">=24.8.0"
matplotlib = ">=3.10.0"  # the tests of visualize_slices (the extra "viz")

[tool.poetry.group.benchmark]
optional = true

[tool.poetry.group.benchmark.dependencies]
# PyRadiomics is NOT managed by Poetry due to:
#   1. Official PyPI release (3.1.0) only supports Python 3.8-3.11
#   2. Git dependencies cause SSL issues on some systems
# Install manually when running benchmarks:
#   poetry run pip install git+https://github.com/AIM-Harvard/pyradiomics.git SimpleITK
SimpleITK = ">=2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
files = ["pictologics"]
exclude = "^(tests|dev|docs|site|htmlcov|brain|\\.agent)/"
exclude_gitignore = true

[[tool.mypy.overrides]]
module = ["tests.*", "dev.*"]
ignore_errors = true

# numba 0.67 ships incomplete type hints (prange, jitted calls, numba.config); read numba as
# untyped, as mypy did before numba had type hints.
[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:The NumPy module was reloaded:UserWarning"
]

[tool.coverage.run]
source = ["pictologics"]
# Python 3.12's sys.monitoring: the default tracer is many times slower (it made the
# import of highdicom, a former test dependency, take 33 s instead of 0.2 s).
core = "sysmon"
omit = ["tests/*", "dev/*", "docs/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# --- Towncrier (changelog management) ---
[tool.towncrier]
# Note: We do NOT set `package` here to avoid importing pictologics
# (which triggers slow Numba JIT warmup). Version is passed explicitly
# via `towncrier build --version X.Y.Z` at release time.
directory = "changes"
filename = "docs/CHANGELOG.md"
title_format = "## [{version}] - {project_date}"
start_string = "<!-- towncrier release notes start -->\n"
orphan_prefix = "+"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "optimized"
name = "Optimized"
showcontent = true

[[tool.towncrier.type]]
directory = "deps"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true
